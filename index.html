<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Предложка | [ZM] Лик Безумия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16130f;
  --panel:#1f1a14;
  --panel-2:#272018;
  --line:#3a3025;
  --bone:#ece3d2;
  --dim:#8a7f6d;
  --amber:#d9a13b;
  --rust:#a9432c;
  --khaki:#7c8168;
  --radius:2px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--bone);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:14px;
  min-height:100vh;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);
}
h1,h2,h3,button,.col-head,.eyebrow{font-family:"Oswald",Impact,sans-serif;text-transform:uppercase;letter-spacing:.08em}

/* ── шапка ─────────────────────────────── */
header{
  border-bottom:1px solid var(--line);
  background:var(--panel);
  padding:14px 20px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
}
.mark{
  width:34px;height:34px;flex:none;
  border:2px solid var(--amber);
  display:grid;place-items:center;
  color:var(--amber);font-family:"Oswald";font-size:17px;
  transform:rotate(45deg);
}
.mark span{transform:rotate(-45deg)}
h1{font-size:20px;font-weight:600;margin:0;line-height:1.1}
.eyebrow{display:block;font-size:11px;color:var(--dim);letter-spacing:.22em;font-weight:400}
.spacer{flex:1}
input[type=search],input[type=text],textarea,select{
  background:var(--bg);color:var(--bone);
  border:1px solid var(--line);border-radius:var(--radius);
  font-family:inherit;font-size:13px;padding:8px 10px;
}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
button{
  background:transparent;color:var(--bone);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 12px;font-size:12px;cursor:pointer;
}
button:hover{border-color:var(--amber);color:var(--amber)}
button.primary{background:var(--amber);color:#16130f;border-color:var(--amber);font-weight:600}
button.primary:hover{background:#eab54f;color:#16130f}
button.danger:hover{border-color:var(--rust);color:var(--rust)}

/* ── доска ─────────────────────────────── */
.board{
  display:grid;
  grid-template-columns:repeat(5,minmax(240px,1fr));
  gap:14px;padding:20px;align-items:start;
}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:120px;display:flex;flex-direction:column}
.col.drop{border-color:var(--amber);background:var(--panel-2)}
.col-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-bottom:1px solid var(--line);
  font-size:13px;
}
.col-head .bar{width:14px;height:3px;background:var(--khaki)}
.col-head .cnt{margin-left:auto;color:var(--dim);font-size:12px;font-family:"IBM Plex Mono"}
.cards{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}

.card{
  position:relative;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-left:4px solid var(--khaki);
  border-radius:var(--radius);
  padding:10px 12px 10px 14px;
  cursor:grab;
}
.card:hover{border-color:#4d4130;border-left-color:var(--amber)}
.card.dragging{opacity:.4}
.card .txt{white-space:pre-wrap;word-break:break-word;line-height:1.45;font-size:13px}
.card .meta{display:flex;gap:6px;align-items:center;margin-top:8px}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);color:var(--dim)}
.card .acts{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.card:hover .acts,.card:focus-within .acts{opacity:1}
.card .acts button{padding:2px 7px;font-size:11px;line-height:1.4}

/* уровень угрозы — фирменная штриховка */
.card[data-lvl="hi"]{border-left:4px solid transparent;
  background-image:repeating-linear-gradient(135deg,var(--rust) 0 6px,#7d3120 6px 12px);
  background-size:4px 100%;background-repeat:no-repeat;background-position:left top;
  padding-left:14px;
}
.card[data-lvl="hi"] .tag{border-color:var(--rust);color:#d9765f}
.card[data-lvl="lo"]{border-left-color:#4f5540}
.card[data-lvl="lo"] .txt{color:#c3b9a5}

.add{border:1px dashed var(--line);color:var(--dim);width:100%;text-align:left;padding:9px 12px;font-size:12px}
.add:hover{color:var(--amber);border-color:var(--amber)}
.editor{display:flex;flex-direction:column;gap:8px;background:var(--panel-2);border:1px solid var(--amber);padding:10px;border-radius:var(--radius)}
.editor textarea{resize:vertical;min-height:70px;width:100%}
.editor .row{display:flex;gap:8px}
.editor .row select{flex:1}
.empty{color:#5f5748;font-size:12px;padding:6px 2px}
footer{padding:0 20px 28px;color:var(--dim);font-size:11px;letter-spacing:.06em}
@media(max-width:900px){.board{grid-template-columns:1fr;padding:14px}header{padding:12px 14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="mark"><span>ZM</span></div>
  <div>
    <span class="eyebrow">Предложка сервера</span>
    <h1>[ZM] Лик Безумия — Хардкорный режим</h1>
  </div>
  <div class="spacer"></div>
  <input type="search" id="q" placeholder="Поиск по карточкам…" style="min-width:190px">
  <button id="exportBtn">Выгрузить JSON</button>
  <button id="importBtn">Загрузить JSON</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</header>

<div class="board" id="board"></div>

<footer>Карточки хранятся в этом браузере. Чтобы перенести доску на другой компьютер — «Выгрузить JSON», затем «Загрузить JSON».</footer>

<script>
const COLUMNS = [
  {id:"queue",   name:"Очередь",           color:"#7c8168"},
  {id:"high",    name:"Важное",            color:"#a9432c"},
  {id:"low",     name:"Не сильно важное",  color:"#4f5540"},
  {id:"work",    name:"В работе",          color:"#d9a13b"},
  {id:"done",    name:"Готово",            color:"#5d7a52"}
];
const LEVELS = [
  {id:"hi", name:"Важное"},
  {id:"md", name:"Обычное"},
  {id:"lo", name:"Не сильно важное"}
];
const KEY = "zm_board_v1";

let state = load();
let filter = "";

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {cards:[
    {id:uid(), col:"queue", lvl:"hi", text:"Сделать систему предупреждений, чтобы можно было выдать предупреждение игроку"},
    {id:uid(), col:"queue", lvl:"hi", text:"Сохранение выбора класса зомби и костюма даже после перезахода"},
    {id:uid(), col:"queue", lvl:"md", text:"Неуязвимость для зомби при возрождении"},
    {id:uid(), col:"queue", lvl:"lo", text:"При любой покупке даётся бонусом пистолет"}
  ]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  COLUMNS.forEach(col=>{
    const list = state.cards.filter(c=>c.col===col.id &&
      (!filter || c.text.toLowerCase().includes(filter)));
    const el = document.createElement("section");
    el.className = "col";
    el.dataset.col = col.id;
    el.innerHTML =
      '<div class="col-head"><span class="bar" style="background:'+col.color+'"></span>'+
      col.name+'<span class="cnt">'+list.length+'</span></div>'+
      '<div class="cards"></div>';
    const cards = el.querySelector(".cards");

    if(!list.length) cards.insertAdjacentHTML("beforeend",'<div class="empty">Пусто. Добавьте карточку.</div>');

    list.forEach(c=>{
      const lvlName = (LEVELS.find(l=>l.id===c.lvl)||LEVELS[1]).name;
      const card = document.createElement("article");
      card.className = "card";
      card.draggable = true;
      card.dataset.id = c.id;
      card.dataset.lvl = c.lvl;
      card.innerHTML =
        '<div class="txt">'+esc(c.text)+'</div>'+
        '<div class="meta"><span class="tag">'+lvlName+'</span>'+
        '<span class="acts"><button data-act="edit">Правка</button>'+
        '<button class="danger" data-act="del">Удалить</button></span></div>';
      card.addEventListener("dragstart",e=>{
        e.dataTransfer.setData("text/plain",c.id);
        card.classList.add("dragging");
      });
      card.addEventListener("dragend",()=>card.classList.remove("dragging"));
      card.querySelector('[data-act="del"]').onclick = ()=>{
        state.cards = state.cards.filter(x=>x.id!==c.id); save(); render();
      };
      card.querySelector('[data-act="edit"]').onclick = ()=> openEditor(cards, col.id, c, card);
      cards.appendChild(card);
    });

    const add = document.createElement("button");
    add.className = "add";
    add.textContent = "+ Добавить карточку";
    add.onclick = ()=> openEditor(cards, col.id, null, add);
    cards.appendChild(add);

    el.addEventListener("dragover",e=>{e.preventDefault(); el.classList.add("drop");});
    el.addEventListener("dragleave",()=>el.classList.remove("drop"));
    el.addEventListener("drop",e=>{
      e.preventDefault(); el.classList.remove("drop");
      const id = e.dataTransfer.getData("text/plain");
      const card = state.cards.find(x=>x.id===id);
      if(card){ card.col = col.id; save(); render(); }
    });
    board.appendChild(el);
  });
}

function openEditor(container, colId, card, anchor){
  const box = document.createElement("div");
  box.className = "editor";
  box.innerHTML =
    '<textarea placeholder="Текст предложения">'+(card?esc(card.text):"")+'</textarea>'+
    '<div class="row"><select>'+
      LEVELS.map(l=>'<option value="'+l.id+'"'+((card&&card.lvl===l.id)||(!card&&l.id==="md")?" selected":"")+'>'+l.name+'</option>').join("")+
    '</select>'+
    '<button class="primary" data-act="ok">Сохранить</button>'+
    '<button data-act="cancel">Отмена</button></div>';
  anchor.replaceWith(box);
  const ta = box.querySelector("textarea");
  ta.focus();
  box.querySelector('[data-act="cancel"]').onclick = render;
  box.querySelector('[data-act="ok"]').onclick = ()=>{
    const text = ta.value.trim();
    const lvl = box.querySelector("select").value;
    if(!text){ render(); return; }
    if(card){ card.text = text; card.lvl = lvl; }
    else { state.cards.push({id:uid(), col:colId, lvl, text}); }
    save(); render();
  };
  ta.addEventListener("keydown",e=>{
    if(e.key==="Enter" && (e.ctrlKey||e.metaKey)) box.querySelector('[data-act="ok"]').click();
    if(e.key==="Escape") render();
  });
}

document.getElementById("q").addEventListener("input",e=>{
  filter = e.target.value.trim().toLowerCase(); render();
});
document.getElementById("exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "board.json"; a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick = ()=> document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!data || !Array.isArray(data.cards)) throw 0;
      state = data; save(); render();
    }catch(err){ alert("Файл не читается: нужен board.json, выгруженный этой доской."); }
  };
  r.readAsText(f);
  e.target.value = "";
};

render();
</script>
</body>
</html>
